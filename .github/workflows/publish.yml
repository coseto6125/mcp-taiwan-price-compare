name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # A tag triggers nothing in test.yml, so without this the path from `git push --tags`
  # to an irreversible PyPI upload has no check on it at all.
  gate:
    name: Verify the tagged commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Tag must match the packaged version
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          packaged="$(uv run python -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "$tagged" != "$packaged" ]; then
            echo "tag $GITHUB_REF_NAME does not match pyproject version $packaged" >&2
            exit 1
          fi

      - name: Run linter
        run: uv run ruff check --no-fix src tests

      - name: Check formatting
        run: uv run ruff format --check src tests

      - name: Run type checker
        run: uv run mypy src/price_compare/ --ignore-missing-imports

      # Deterministic tests only: a site outage must not block a release that is already
      # cut, and the live matrix in test.yml covers the platforms on master.
      - name: Run offline tests
        run: uv run pytest tests/ -m "not live" --tb=short
        env:
          PYTHONUNBUFFERED: "1"

  build:
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Build package
        run: uv build

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v7

      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          skip-existing: true
