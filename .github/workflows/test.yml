name: Test

on:
  push:
    branches: [master, main]
    # `.github/workflows/**` is watched too: without it a change to the workflows
    # themselves runs nothing, so a broken gate is only found by the next commit that
    # happens to touch src or tests.
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/**'
  pull_request:
    branches: [master, main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/**'
  workflow_dispatch:

# A new push supersedes the previous run on the same ref; the old one is only burning
# minutes on code nobody will merge.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev

      # --no-fix is required: pyproject sets fix = true, so a bare `ruff check` repairs
      # the checkout and reports green on code that never passed.
      - name: Run linter
        run: uv run ruff check --no-fix src tests

      - name: Check formatting
        run: uv run ruff format --check src tests

      - name: Run type checker
        run: uv run mypy src/price_compare/ --ignore-missing-imports

      # Deterministic tests only. The live-network ones run in the matrix below, where a
      # site outage reds one platform instead of the whole gate.
      - name: Run offline tests
        run: uv run pytest tests/ -v --tb=short -m "not live"
        env:
          PYTHONUNBUFFERED: "1"

  test-platforms:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test

    strategy:
      fail-fast: false
      matrix:
        include:
          # Platforms whose tests live in the shared tests/test_platforms.py
          - platform: pchome
            file: tests/test_platforms.py
            klass: TestPChome
          - platform: momo
            file: tests/test_platforms.py
            klass: TestMomo
          - platform: coupang
            file: tests/test_platforms.py
            klass: TestCoupang
          - platform: etmall
            file: tests/test_platforms.py
            klass: TestETMall
          - platform: rakuten
            file: tests/test_platforms.py
            klass: TestRakuten
          - platform: yahoo_shopping
            file: tests/test_platforms.py
            klass: TestYahooShopping
          - platform: yahoo_auction
            file: tests/test_platforms.py
            klass: TestYahooAuction
          # Platforms with a dedicated test module
          - platform: costco
            file: tests/test_costco.py
            klass: TestCostco
          - platform: pxbox
            file: tests/test_pxbox.py
            klass: TestPxbox
          - platform: uniprosperity
            file: tests/test_uniprosperity.py
            klass: TestUniProsperity
          # books is deliberately absent: books.com.tw sits behind Cloudflare and answers
          # 403 to GitHub-hosted runners (probed 2026-09-08 with the project's own client,
          # cf-ray in SEA), while the same request from Taiwan returns 200. The tests still
          # run locally: `uv run pytest tests/test_books.py -m live`.
          - platform: ruten
            file: tests/test_ruten.py
            klass: TestRuten
          - platform: buy123
            file: tests/test_buy123.py
            klass: TestBuy123
          - platform: pcone
            file: tests/test_pcone.py
            klass: TestPcone

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Test ${{ matrix.platform }}
        run: uv run pytest "${{ matrix.file }}" -v -k "${{ matrix.klass }}" -m live --tb=short
        env:
          PYTHONUNBUFFERED: "1"
